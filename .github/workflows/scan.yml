name: Radar del Reto (LBank)

on:
  schedule:
    - cron: "*/30 0-5,12-14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Escanear LBank y alertar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL: ${{ secrets.CAPITAL }}
        run: python bot.py
      - name: Guardar estado (anti-spam)
        run: |
          if [[ -n $(git status --porcelain estado.json) ]]; then
            git config user.name "radar-bot"
            git config user.email "bot@users.noreply.github.com"
            git add estado.json
            git commit -m "estado [skip ci]"
            git push
          fi
