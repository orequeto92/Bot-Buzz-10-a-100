name: Radar del Reto (LBank)

on:
  schedule:
    # Cada 15 min, TODOS los dias: asi los comandos de Telegram se responden
    # siempre (con <=15 min de espera). Las alertas proactivas las filtra el
    # propio bot.py (solo ventanas buenas de Medellin y solo entre semana).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Enviar informe aunque no haya setup (para probar)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Sin dependencias: solo libreria estandar + APIs publicas.
      - name: Escanear LBank y alertar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL: ${{ secrets.CAPITAL }}
        run: |
          if [[ "${{ inputs.forzar }}" == "true" ]]; then
            python bot.py --forzar
          else
            python bot.py
          fi
      - name: Guardar estado (anti-spam)
        run: |
          if [[ -n $(git status --porcelain estado.json) ]]; then
            git config user.name "radar-bot"
            git config user.email "bot@users.noreply.github.com"
            git add estado.json
            git commit -m "estado [skip ci]"
            git push
          fi
